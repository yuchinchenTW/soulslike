services:
  - type: web
    name: soulslike
    runtime: static
    buildCommand: npm install --ignore-scripts --no-audit --no-fund
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /node_modules/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
